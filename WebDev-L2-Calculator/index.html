<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator - OIBSIP L2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <div class="calc" role="application" aria-label="Calculator">
      <p class="eyebrow">OIBSIP / Level 2 / Task 1</p>
      <div class="calc__display" aria-live="polite">
        <div class="calc__expression" id="expression">&nbsp;</div>
        <div class="calc__result" id="result">0</div>
      </div>
      <div class="calc__keys" id="keys">
        <button type="button" class="key key--fn" data-action="clear">C</button>
        <button type="button" class="key key--fn" data-action="backspace" aria-label="Backspace">⌫</button>
        <button type="button" class="key key--fn" data-action="percent">%</button>
        <button type="button" class="key key--op" data-operator="÷" aria-label="Divide">÷</button>

        <button type="button" class="key" data-digit="7">7</button>
        <button type="button" class="key" data-digit="8">8</button>
        <button type="button" class="key" data-digit="9">9</button>
        <button type="button" class="key key--op" data-operator="×" aria-label="Multiply">×</button>

        <button type="button" class="key" data-digit="4">4</button>
        <button type="button" class="key" data-digit="5">5</button>
        <button type="button" class="key" data-digit="6">6</button>
        <button type="button" class="key key--op" data-operator="-" aria-label="Subtract">-</button>

        <button type="button" class="key" data-digit="1">1</button>
        <button type="button" class="key" data-digit="2">2</button>
        <button type="button" class="key" data-digit="3">3</button>
        <button type="button" class="key key--op" data-operator="+" aria-label="Add">+</button>

        <button type="button" class="key key--zero" data-digit="0">0</button>
        <button type="button" class="key" data-action="decimal">.</button>
        <button type="button" class="key key--eq" data-action="equals" aria-label="Equals">=</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
