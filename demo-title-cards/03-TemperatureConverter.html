<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Title Card - Temperature Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "IBM Plex Mono", monospace;
      background:
        linear-gradient(#b8c9d9 1px, transparent 1px),
        linear-gradient(90deg, #b8c9d9 1px, transparent 1px),
        linear-gradient(#8fa8bf 1px, transparent 1px),
        linear-gradient(90deg, #8fa8bf 1px, transparent 1px),
        #e8f0f5;
      background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
      color: #1a2a38;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .sheet {
      width: min(900px, calc(100% - 56px));
      background: #f7fbfd;
      border: 2px solid #1a2a38;
      padding: 48px 56px;
      box-shadow: 8px 8px 0 #1a2a3822;
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #1a2a38;
      padding-bottom: 16px;
      margin-bottom: 32px;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .badge {
      font-weight: 700;
      color: #0b5f8a;
      border: 2px solid #0b5f8a;
      padding: 6px 12px;
      background: #d4eaf7;
    }
    .form { color: #5a6a78; font-size: 12px; }
    .kicker {
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #0b5f8a;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(40px, 5.5vw, 58px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
      text-transform: uppercase;
    }
    .eq {
      display: inline-block;
      font-size: 18px;
      background: #1a2a38;
      color: #e8f0f5;
      padding: 10px 18px;
      margin-bottom: 24px;
      letter-spacing: 0.08em;
    }
    .desc {
      font-size: 17px;
      line-height: 1.6;
      color: #3a4a58;
      margin-bottom: 36px;
      max-width: 36em;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 28px;
      border-top: 2px solid #1a2a38;
      padding-top: 18px;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .meta strong { color: #0b5f8a; font-weight: 600; }
    .stamp {
      position: absolute;
      bottom: 40px;
      right: 40px;
      border: 3px solid #b03a2e;
      color: #b03a2e;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 8px 14px;
      transform: rotate(-6deg);
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="header">
      <span class="badge">OIBSIP Demo</span>
      <span class="form">Form T-03 / Lab Record</span>
    </div>
    <p class="kicker">Level 1 - Task 3 / Temperature Converter</p>
    <h1>Temperature Converter</h1>
    <div class="eq">C / F / K</div>
    <p class="desc">Lab worksheet layout - convert Celsius, Fahrenheit, and Kelvin with a stamp-button UI.</p>
    <div class="meta">
      <span><strong>Bilal Malik</strong></span>
      <span>Web Development / Designing</span>
      <span>AICTE OIB-SIP</span>
    </div>
    <div class="stamp">Calibrated</div>
  </main>
</body>
</html>
