<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Title Card - Landing Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Libre Baskerville", Georgia, serif;
      background: #f4efe6;
      color: #111;
      display: grid;
      place-items: center;
      min-height: 100vh;
      border: 18px solid #111;
    }
    .sheet {
      width: min(980px, calc(100% - 48px));
      background: #f7f2e9;
      border: 3px solid #111;
      padding: 56px 64px 48px;
      text-align: left;
    }
    .mast {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 4px double #111;
      padding-bottom: 14px;
      margin-bottom: 28px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .mast .mark { color: #c43c25; font-weight: 600; }
    .kicker {
      font-family: "IBM Plex Mono", monospace;
      color: #c43c25;
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 18px;
      font-weight: 600;
    }
    h1 {
      font-size: clamp(48px, 7vw, 72px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
    }
    .rule { height: 3px; background: #111; width: 120px; margin-bottom: 22px; }
    .desc {
      font-size: 20px;
      line-height: 1.5;
      color: #333;
      margin-bottom: 36px;
      max-width: 36em;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 32px;
      border-top: 2px solid #111;
      padding-top: 20px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .meta strong { color: #c43c25; font-weight: 600; }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="mast">
      <span class="mark">OIBSIP Demo</span>
      <span>Vol. 01 / Demo Reel</span>
    </div>
    <p class="kicker">Level 1 - Task 1 / Landing Page</p>
    <h1>Landing Page</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="desc">NovaDesk marketing page - editorial newspaper layout for a calm work OS.</p>
    <div class="meta">
      <span><strong>Bilal Malik</strong></span>
      <span>Web Development / Designing</span>
      <span>AICTE OIB-SIP</span>
    </div>
  </main>
</body>
</html>
