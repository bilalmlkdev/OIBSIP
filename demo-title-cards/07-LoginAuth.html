<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Title Card - Login Auth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Archivo", system-ui, sans-serif;
      background:
        repeating-linear-gradient(
          -45deg,
          #e8e4da 0,
          #e8e4da 14px,
          #ddd8cc 14px,
          #ddd8cc 28px
        );
      color: #111;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      width: min(880px, calc(100% - 56px));
      background: #fff;
      border: 3px solid #111;
      box-shadow: 14px 14px 0 #111;
      padding: 48px 56px;
      position: relative;
    }
    .badge {
      display: inline-block;
      font-family: "Space Grotesk", sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: #f5d020;
      border: 2px solid #111;
      padding: 8px 14px;
      margin-bottom: 28px;
      box-shadow: 4px 4px 0 #111;
    }
    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(44px, 6vw, 64px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin-bottom: 16px;
    }
    .bar {
      width: 96px;
      height: 10px;
      background: #111;
      margin-bottom: 22px;
    }
    .desc {
      font-size: 18px;
      line-height: 1.55;
      color: #333;
      max-width: 34em;
      margin-bottom: 36px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
      border-top: 3px solid #111;
      padding-top: 20px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .meta strong {
      background: #f5d020;
      padding: 2px 8px;
      border: 2px solid #111;
    }
    .corner {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      background: #111;
      color: #f5d020;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      font-family: "Space Grotesk", sans-serif;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="corner" aria-hidden="true">//</div>
    <div class="badge">OIBSIP / Level 2 / Task 4</div>
    <h1>Login Auth</h1>
    <div class="bar" aria-hidden="true"></div>
    <p class="desc">Brutalist form UI - register, login, and local dashboard with SHA-256 hashing.</p>
    <div class="meta">
      <span><strong>Bilal Malik</strong></span>
      <span>Web Development / Designing</span>
      <span>AICTE OIB-SIP</span>
    </div>
  </main>
</body>
</html>
