<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Title Card - Tribute Page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "EB Garamond", Georgia, serif;
      background: #0f0f0f;
      color: #f4efe4;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .sheet {
      width: min(940px, calc(100% - 56px));
      background: #f0e8d8;
      color: #1c1410;
      border-top: 14px solid #6b1e2a;
      border-bottom: 14px solid #6b1e2a;
      padding: 64px 72px 56px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .band {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 14px;
      background: #6b1e2a;
      margin-top: -14px;
    }
    .kicker {
      font-family: "Bodoni Moda", Georgia, serif;
      font-size: 14px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #6b1e2a;
      margin-bottom: 28px;
      font-weight: 700;
    }
    h1 {
      font-family: "Bodoni Moda", Georgia, serif;
      font-size: clamp(48px, 7vw, 72px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0.02em;
      margin-bottom: 20px;
    }
    .orn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
      color: #6b1e2a;
      font-size: 22px;
    }
    .orn::before, .orn::after {
      content: "";
      width: 72px;
      height: 1px;
      background: #6b1e2a;
    }
    .desc {
      font-size: 20px;
      line-height: 1.6;
      color: #3a2e28;
      max-width: 32em;
      margin: 0 auto 36px;
      font-style: italic;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 32px;
      border-top: 1px solid #6b1e2a;
      padding-top: 22px;
      font-family: "Bodoni Moda", Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #3a2e28;
    }
    .meta strong { color: #6b1e2a; font-weight: 700; }
    .folio {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: "Bodoni Moda", Georgia, serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8a7a70;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <p class="kicker">OIBSIP Demo / Level 2 - Task 2</p>
    <h1>Tribute Page</h1>
    <div class="orn" aria-hidden="true">&#10086;</div>
    <p class="desc">Ada Lovelace tribute - archive letterpress with cream stock and oxblood bands.</p>
    <div class="meta">
      <span><strong>Bilal Malik</strong></span>
      <span>Web Development / Designing</span>
      <span>AICTE OIB-SIP</span>
    </div>
    <span class="folio">Plate II</span>
  </main>
</body>
</html>
