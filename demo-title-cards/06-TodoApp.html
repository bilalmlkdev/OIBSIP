<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Title Card - To-Do App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Patrick Hand", "Comic Sans MS", cursive;
      background: #dce8f2;
      color: #1e2a38;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .page {
      width: min(920px, calc(100% - 48px));
      background:
        linear-gradient(90deg, transparent 72px, #c45a5a 72px, #c45a5a 74px, transparent 74px),
        repeating-linear-gradient(
          transparent 0,
          transparent 35px,
          #a8c4de 35px,
          #a8c4de 36px
        ),
        #fbf8f1;
      border: 1px solid #b8a890;
      padding: 48px 56px 44px 96px;
      box-shadow: 6px 6px 0 #b8a89055;
      position: relative;
      min-height: 480px;
    }
    .holes {
      position: absolute;
      left: 22px;
      top: 48px;
      bottom: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hole {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #dce8f2;
      border: 2px solid #b8a890;
    }
    .tape {
      position: absolute;
      top: -14px;
      right: 48px;
      width: 120px;
      height: 36px;
      background: #f0e08a;
      opacity: 0.85;
      transform: rotate(4deg);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }
    .kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #c45a5a;
      font-weight: 600;
      margin-bottom: 16px;
      margin-left: -40px;
    }
    h1 {
      font-size: clamp(48px, 7vw, 68px);
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 8px;
      margin-left: -40px;
      color: #1e2a38;
    }
    .check {
      margin-left: -40px;
      margin-bottom: 24px;
      font-size: 28px;
      color: #c45a5a;
      letter-spacing: 8px;
    }
    .desc {
      font-size: 24px;
      line-height: 1.55;
      color: #3a4a58;
      max-width: 28em;
      margin-bottom: 36px;
      margin-left: -40px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 28px;
      border-top: 2px dashed #a8c4de;
      padding-top: 18px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-left: -40px;
      color: #3a4a58;
    }
    .meta strong { color: #c45a5a; font-weight: 600; }
    .label {
      position: absolute;
      top: 28px;
      right: 40px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: #1e2a38;
      color: #fbf8f1;
      padding: 8px 12px;
      transform: rotate(2deg);
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="holes" aria-hidden="true">
      <span class="hole"></span>
      <span class="hole"></span>
      <span class="hole"></span>
      <span class="hole"></span>
      <span class="hole"></span>
    </div>
    <div class="tape" aria-hidden="true"></div>
    <div class="label">OIBSIP Demo</div>
    <p class="kicker">Level 2 - Task 3 / To-Do App</p>
    <h1>To-Do App</h1>
    <div class="check" aria-hidden="true">&#10003; &#10003; &#9744;</div>
    <p class="desc">Notebook page UI - ruled lines, red margin, handwriting type, localStorage tasks.</p>
    <div class="meta">
      <span><strong>Bilal Malik</strong></span>
      <span>Web Development / Designing</span>
      <span>AICTE OIB-SIP</span>
    </div>
  </main>
</body>
</html>
