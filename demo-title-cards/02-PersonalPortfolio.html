<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Title Card - Personal Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Source Serif 4", Georgia, serif;
      background:
        repeating-linear-gradient(
          transparent 0,
          transparent 31px,
          #c9d4e0 31px,
          #c9d4e0 32px
        ),
        #f3f0e8;
      color: #1a1a1a;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .sheet {
      width: min(920px, calc(100% - 56px));
      background: #faf7f0;
      border: 1px solid #bbb;
      border-left: 6px solid #2c4a6e;
      padding: 56px 64px;
      box-shadow: 14px 14px 0 #2c4a6e22;
      position: relative;
    }
    .stamp {
      position: absolute;
      top: 36px;
      right: 40px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 2px solid #2c4a6e;
      color: #2c4a6e;
      padding: 8px 12px;
      transform: rotate(3deg);
    }
    .avatar {
      width: 72px;
      height: 72px;
      background: #2c4a6e;
      color: #f3f0e8;
      display: grid;
      place-items: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 28px;
      position: relative;
      box-shadow: 8px 8px 0 #2c4a6e33;
    }
    .kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #5a6a7a;
      margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(44px, 6vw, 64px);
      font-weight: 600;
      line-height: 1.1;
      margin-bottom: 14px;
    }
    .desc {
      font-size: 20px;
      color: #333;
      margin-bottom: 36px;
      max-width: 34em;
      line-height: 1.55;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 28px;
      border-top: 2px solid #1a1a1a;
      padding-top: 18px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 14px;
      letter-spacing: 0.04em;
    }
    .meta strong { color: #2c4a6e; font-weight: 500; }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="stamp">OIBSIP Demo</div>
    <div class="avatar" aria-hidden="true">BM</div>
    <p class="kicker">Level 1 - Task 2 / Personal Portfolio</p>
    <h1>Personal Portfolio</h1>
    <p class="desc">Digital resume site - print CV layout with lined sheet and offset mark.</p>
    <div class="meta">
      <span><strong>Bilal Malik</strong></span>
      <span>Web Development / Designing</span>
      <span>AICTE OIB-SIP</span>
    </div>
  </main>
</body>
</html>
