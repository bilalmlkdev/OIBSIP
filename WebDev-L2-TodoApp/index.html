<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App - OIBSIP L2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__head">
      <p class="eyebrow">OIBSIP / Level 2 / Task 3</p>
      <h1>To-Do</h1>
      <p class="sub">Add, complete, edit, delete - saved in localStorage.</p>
    </header>

    <form id="add-form" class="add" autocomplete="off">
      <label class="sr-only" for="task-input">New task</label>
      <input
        id="task-input"
        type="text"
        name="task"
        placeholder="What needs doing?"
        maxlength="200"
      />
      <button type="submit" class="btn">Add Task</button>
    </form>
    <p id="add-error" class="error" role="alert" hidden></p>

    <section class="list-block" aria-labelledby="pending-title">
      <div class="list-block__head">
        <h2 id="pending-title">Pending</h2>
        <span class="count" id="pending-count">0 pending</span>
      </div>
      <ul class="list" id="pending-list"></ul>
      <p class="empty" id="pending-empty">Nothing pending - add a task above.</p>
    </section>

    <section class="list-block list-block--done" aria-labelledby="done-title">
      <div class="list-block__head">
        <h2 id="done-title">Completed</h2>
        <span class="count" id="done-count">0 completed</span>
      </div>
      <ul class="list" id="done-list"></ul>
      <p class="empty" id="done-empty">No completed tasks yet.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
